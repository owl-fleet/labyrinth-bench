meta:
  id: seq-6
  name: "Seq-6 — Sequential Binary Routing"
  version: 1
  # Six binary classification decisions in sequence.
  # Each node presents a self-contained agent-routing scenario.
  # The correct answer (1 or 2) is derivable from the node description alone —
  # no cross-turn memory required. Tests whether a model can execute a
  # deterministic decision chain without losing state or format across 6 turns.
  #
  # Gate answers alternate 1/2/1/2/1/2 to prevent always-1 or always-2 strategies.
  # Dead ends are 1 node deep: wrong answer → immediate wall → backtrack.
  # Measures: classification accuracy, JSON format stability, backtrack recovery.
  #
  # Optimal: start → s1 → s2 → s3 → s4 → s5 → exit = 6 commits
  # Budget = optimal × 3: room for up to 6 wrong answers with full backtrack recovery
  optimal_commits: 6
  optimal_path: [start, s1, s2, s3, s4, s5, exit]
  step_budget: 18
  gate_count: 6
  dead_end_count: 6
  loop_count: 0
  dead_end_patience: 3

nodes:

  # ══════════════════════════════════════════════
  # DECISION 1 — Live metric vs. knowledge search
  # Correct answer: 1
  # ══════════════════════════════════════════════
  - id: start
    description: >
      A user asks: "What is the current memory usage of the timescaledb container?"
      This requests a live, real-time metric value — not historical documentation.
      The question uses the word "current" and refers to a running container's present state.
      You are the routing agent. Choose the correct action.
    paths:
      - id: forward
        label: "Route this request"
        destination: s1
        gate:
          problem: "1 = query_prometheus_live, 2 = search_knowledge_docs"
          answer: "1"
          wrong_destination: dz1

  # ══════════════════════════════════════════════
  # DECISION 2 — How-to question vs. live state
  # Correct answer: 2
  # ══════════════════════════════════════════════
  - id: s1
    description: >
      A user asks: "How do I configure SSL certificates for the Traefik reverse proxy?"
      This is a procedural how-to question about configuration syntax and setup steps.
      No live system state is involved — the answer exists in documentation.
      You are the routing agent. Choose the correct action.
    paths:
      - id: forward
        label: "Route this request"
        destination: s2
        gate:
          problem: "1 = query_live_system_state, 2 = search_knowledge_docs"
          answer: "2"
          wrong_destination: dz2

  # ══════════════════════════════════════════════
  # DECISION 3 — Stale document vs. re-query
  # Correct answer: 1
  # ══════════════════════════════════════════════
  - id: s2
    description: >
      You retrieved a document with last_modified 14 months ago.
      The user's question explicitly asked for the "current" service endpoint values.
      Endpoints change when services are reconfigured or redeployed.
      A 14-month-old document is stale for a question about current values.
      You must decide what to do with this result.
    paths:
      - id: forward
        label: "Handle this result"
        destination: s3
        gate:
          problem: "1 = discard_and_requery_for_fresh_data, 2 = return_retrieved_document_as_is"
          answer: "1"
          wrong_destination: dz3

  # ══════════════════════════════════════════════
  # DECISION 4 — Complete result vs. more calls
  # Correct answer: 2
  # ══════════════════════════════════════════════
  - id: s3
    description: >
      A tool call returned a JSON object with all required fields populated.
      The result directly answers the user's question and contains no errors.
      No fields are missing. No ambiguity exists in the returned data.
      Additional tool calls would return redundant information.
      You must decide the next step.
    paths:
      - id: forward
        label: "Decide next step"
        destination: s4
        gate:
          problem: "1 = make_additional_tool_calls_for_verification, 2 = use_this_result_to_compose_answer"
          answer: "2"
          wrong_destination: dz4

  # ══════════════════════════════════════════════
  # DECISION 5 — Use existing context vs. new query
  # Correct answer: 1
  # ══════════════════════════════════════════════
  - id: s4
    description: >
      The user asks a follow-up: "What port does it run on?"
      In the previous turn you retrieved the full service configuration,
      which included the port number. That information is still in the context window.
      Making a new search would re-retrieve data that is already available.
      You must decide how to get the port value.
    paths:
      - id: forward
        label: "Get the port value"
        destination: s5
        gate:
          problem: "1 = extract_from_existing_context, 2 = run_new_knowledge_search_for_port"
          answer: "1"
          wrong_destination: dz5

  # ══════════════════════════════════════════════
  # DECISION 6 — Return answer vs. more validation
  # Correct answer: 2
  # ══════════════════════════════════════════════
  - id: s5
    description: >
      The composed answer addresses all parts of the user's original question.
      All tool calls completed successfully with no errors.
      No ambiguous or missing information remains.
      The response is ready. Further validation steps would add no value.
      You must decide whether to return the answer or continue processing.
    paths:
      - id: forward
        label: "Final action"
        destination: exit
        gate:
          problem: "1 = run_additional_validation_steps, 2 = return_final_answer_to_user"
          answer: "2"
          wrong_destination: dz6

  # ══════════════════════════════════════════════
  # TERMINAL
  # ══════════════════════════════════════════════
  - id: exit
    terminal: true
    description: >
      All six routing decisions were made correctly. The agent pipeline executed
      without error. EXIT reached.
    paths: []

  # ══════════════════════════════════════════════
  # WRONG-ANSWER DEAD ENDS
  # One per decision — immediate wall, forces backtrack
  # ══════════════════════════════════════════════
  - id: dz1
    description: >
      Wrong routing: the knowledge search returned documentation, but the user
      needed a live metric value. The response is stale and unhelpful. Dead end.
    paths: []

  - id: dz2
    description: >
      Wrong routing: a live state query returned runtime values, but the user
      needed configuration documentation. The response is irrelevant. Dead end.
    paths: []

  - id: dz3
    description: >
      Wrong action: the stale document was returned as-is. The user received
      outdated endpoint values that no longer match the running system. Dead end.
    paths: []

  - id: dz4
    description: >
      Wrong action: unnecessary additional tool calls were made. Resources were
      wasted on redundant queries when the answer was already available. Dead end.
    paths: []

  - id: dz5
    description: >
      Wrong action: a new search was triggered for data that was already in context.
      The redundant query consumed budget unnecessarily. Dead end.
    paths: []

  - id: dz6
    description: >
      Wrong action: additional validation steps were run on a complete, error-free
      response. The pipeline stalled at the final step. Dead end.
    paths: []
