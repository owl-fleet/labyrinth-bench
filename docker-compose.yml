services:
  labyrinth-bench:
    build: .
    container_name: labyrinth-bench
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      DEGS_DIR: /app/degs
      DB_DSN: postgresql://knowledge:${POSTGRES_PASSWORD}@timescaledb:5432/knowledge
    volumes:
      - .:/app          # live-reload for Phase 0 development
      - ./results:/results
    networks:
      - proxy
      - ai
    labels:
      - "traefik.enable=false"

networks:
  proxy:
    external: true
  ai:
    name: ai
    external: true
